<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduSphere — Department Portal</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@5/dist/jspreadsheet.min.css">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/jsuites@5/dist/jsuites.min.css">

</head>


<body>

    <!-- =========================
         SIDEBAR
         ========================= -->

    <aside id="sidebar">

        <div class="brand">
            EduSphere
        </div>

        <ul
            class="nav-list"
            id="navList"
        ></ul>


        <!-- LOGOUT -->

        <div class="sidebar-bottom">

            <a
                href="{{ url_for('auth.logout') }}"
                class="logout-nav"
            >

                <span class="logout-icon">↪</span>

                <span>Logout</span>

            </a>

        </div>

    </aside>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main id="main-content">

        <header>

            <div>

                <h2 id="page-title">
                    Dashboard
                </h2>

                <div class="dept-pill" id="deptPill">
    {{ department_name|safe }}
</div>

            </div>


            <!-- USER PROFILE -->

            <div class="user-profile">

                <div>

                    <div
                        id="userName"
                        style="
                            font-weight:600;
                            font-size:13px;
                            text-align:right;
                        "
                    >
                        {{ user_name }}
                    </div>

                    <div
                        class="user-role"
                        id="userRole"
                    >
                        Student
                    </div>

                </div>


                <div
                    class="avatar"
                    id="userAvatar"
                >
                    S
                </div>

            </div>

        </header>


        <!-- DYNAMIC CONTENT -->

        <div
            class="content-area"
            id="viewContainer"
        ></div>

    </main>


    <!-- SERVER VALUES -->
<script>
    window.USER_ROLE = "{{ user_role }}";
    window.USER_DEPARTMENT = {{ department_name | tojson }};
</script>

<!-- JSUITES -->
<script src="https://cdn.jsdelivr.net/npm/jsuites@5/dist/jsuites.min.js"></script>

<!-- JSPREADSHEET -->
<script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@5/dist/index.min.js"></script>

<!-- DASHBOARD JS: LOAD ONLY ONCE -->
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>


</body>

</html>
